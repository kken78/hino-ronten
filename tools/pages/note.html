<style>

  --l-kakutei:#7fc0cb; --l-mikakunin:#e0b45c; --l-mikakunin-bg:#2e2716; --l-hit:#a9aeb9; --l-hit-bg:#252a31;
  --l-ronten:#c3a6e6; --l-ronten-bg:#2a2235; color-scheme:dark}}

  --paper:#141a19; --sheet:#1b2321; --ink:#e3e9e7; --muted:#9aa7a3; --rule:#33403d;

<script>
(function(){
const RAW=document.getElementById('data').textContent.trim();
if(RAW==='__DA'+'TA__'){document.querySelector('main').innerHTML='<p class="intro">このファイルは画面のひな形で、データが入っていません。</p>';return;}
const D=JSON.parse(RAW), P=JSON.parse(document.getElementById('page').textContent), R=D.records;
/* 見方（LINK_SCHEMA §2・§16）：事業・期の計画・施設・地区・組織・テーマ。PROG は見方が事業のときだけ */
const SHEET=D.sheets.find(s=>s.view===P.view);
const PROG=P.view_kind==='事業'?D.programs.find(p=>p.key===P.view):null;
/* 「本事業」の言い換え（LINK_SCHEMA §16.4）。目的と手段の図の印も同じ言葉で、テーマの見方では付けない */
const SELF={'事業':'本事業','期の計画':'本計画','施設':'本施設','地区':'本地区','組織':'本組織','枠の要素':'本要素','テーマ':'本テーマ'}[P.view_kind]||'本テーマ';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=(url,t)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);
const lab=k=>(D.names.sources||{})[k]||k;
const num=n=>Number(n).toLocaleString('ja-JP');
const jd=s=>{if(!s)return '';const m=String(s).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);return m?(m[3]?`${m[1]}年${+m[2]}月${+m[3]}日`:`${m[1]}年${+m[2]}月`):s};
const short=(s,n)=>s.length>n?s.slice(0,n)+'…':s;
const tbl=(head,rows)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const sec=(title,sub,body)=>`<section class="sec"><h2>${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</h2>${body}</section>`;
const KIND={'留保':'今後検討','考えていない':'予定なし','事実・数字':'事実・数値','方針・考え':'方針・考え方','時期・手順':'時期・手順','数字・見込み':'数値・見込み','事実の確認':'事実の確認','提案への考え':'提案への見解','住民意見・手続き':'住民意見・手続き','要望':'要望','その他':'その他'};
const pickers=[];
/* 選ぶ→全幅で開く：items=[{key,title,value,render}] */
function picker(id,items){pickers.push({id,items});return `<div class="picker" role="tablist" id="${id}">${items.map((it,i)=>`<button role="tab" aria-selected="${i===0}" data-i="${i}"><span class="t">${esc(it.title)}</span><span class="v${it.none?' none':''}${it.meta?' meta':''}">${esc(it.value)}</span></button>`).join('')}</div><div class="panel" id="${id}-panel">${items[0]?items[0].render():''}</div>`}
function bindPickers(){pickers.forEach(p=>{const el=document.getElementById(p.id);if(!el)return;el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));document.getElementById(p.id+'-panel').innerHTML=p.items[+b.dataset.i].render()})})}

/* 見出し：見方の名前と要点（LINK_SCHEMA §16.1） */
const NOREC='未記録';
const bud=PROG?D.budget.find(b=>b.program===PROG.key):null;
const budFy=bud?((bud.key.match(/^fh:fuhyo-r(\d+)\//)||[])[1]||''):'';
document.title=`${P.name}ノート`;
document.getElementById('h1').textContent=P.name;
const fact=(label,body)=>`<div><span>${esc(label)}</span> ${body}</div>`;
let facts='';
if(PROG){
  const pol=D.policies.find(p=>p.key===PROG.policy);
  const yrs=(PROG.years||[]).map(y=>+String(y).replace(/^R/,'')).filter(n=>n);
  document.getElementById('desc').textContent=PROG.desc||'';
  facts=(PROG.cost?`<div><span>${esc(PROG.cost.label)}（実施計画${yrs.length?` 令和${yrs[0]}〜${yrs[yrs.length-1]}年度`:''}）</span> <b>${num(PROG.cost.amount)}</b> ${esc(PROG.cost.unit)} ${A(PROG.source,'出典')}</div>`:'')+
    (bud?`<div><span>令和${esc(budFy)}年度当初予算額</span> <b>${num(bud.amount)}</b> ${esc(bud.unit)} ${A(bud.url,'出典')}</div>`+
    fact('担当課',`${esc((bud.dept||[]).join('・'))} ${A(bud.url,'出典')}`):'')+
    fact('総合計画',`${esc(PROG.field_no)} ${esc(PROG.field_name)}${pol?`／基本施策${esc(pol.no)} ${esc(pol.name)} ${A(pol.url,'出典')}`:''}`);
}else if(P.view_kind==='期の計画'){
  const pl=D.plans.find(p=>p.key===P.view)||{};
  facts=fact('計画期間',`${esc(pl.start_fy)}〜${esc(pl.end_fy)}年度 ${A(pl.url,'出典')}`)+
    fact('策定・改正',esc(pl.posted||NOREC))+
    fact('課題の記載',SHEET.kadai.length?SHEET.kadai.map(x=>esc(x.text)).join('、')+` ${A(SHEET.kadai[0].url,'出典')}`:NOREC);
}else if(P.view_kind==='施設'){
  const f=(D.names.facilities||{})[P.view]||{};
  const st=R.shisetsu.filter(r=>r.facility===P.view&&r.aspect==='状態').sort((a,b)=>(a.source_date+a.source).localeCompare(b.source_date+b.source)).pop();
  facts=fact('地区',esc(f.district||NOREC))+
    fact('状況',st?`${esc(st.value)}${st.target?`（${esc(st.target)}）`:''}${st.kind==='予定'?'（予定）':''}　${esc(jd(st.source_date))} ${A(st.url,lab(st.source))}`:NOREC);
}else if(P.view_kind==='地区'){
  /* 地区の名前と、その地区の施設（names.views の施設のうち district がその地区の名前のもの。§14・§16.1） */
  const V=D.names.views||{};
  const fs=Object.keys(V).filter(k=>k.startsWith('fa:')&&V[k].district&&V[k].district===P.name).map(k=>V[k].name||k);
  facts=fact('地区',esc(P.name||NOREC))+fact('施設',fs.length?esc(fs.join('、')):NOREC);
}else if(P.view_kind==='組織'){
  /* 組織の名前と、ほかの表記（参照表の aliases。§14・§16.1） */
  const al=((D.names.views||{})[P.view]||{}).aliases||[];
  facts=fact('組織',esc(P.name||NOREC))+fact('ほかの表記',al.length?esc(al.join('、')):NOREC);
}else if(P.view_kind==='枠の要素'){
  /* 枠組みの名前と、その要素に該当する事項（LINK_SCHEMA §16.1。ADR-37） */
  const W=(D.waku||[]).find(w=>P.view.startsWith(w.key+'/'))||{};const el=(W.elements||[]).find(e=>e.view===P.view)||{};
  facts=fact('枠組み',`${esc(W.name||NOREC)} ${A(W.url,'出典')}`)+fact('要素',`${esc(el.n||'')} ${esc(el.name||'')}`)+fact('該当する事項',esc((el.points||[]).join('、')||NOREC));
}else{
  const ch=D.sheets.find(s=>s.view===D.chushin&&s.view!==D.theme);
  facts=fact('系列の計画',D.plans.map(p=>A(p.url,p.name)).join('、')||NOREC)+
    fact('中心の見方',D.chushin?esc(ch?`${ch.name}（${D.chushin}）`:D.chushin):NOREC);
}
document.getElementById('facts').innerHTML=facts;

/* 共通：事項ごとの記載 */
/* 事柄の範囲（LINK_SCHEMA §16.2）：その見方の事柄と、テーマ全体の事柄（テーマ以外のどの見方のシートにも無い点）。ほかの見方だけの点は出さない */
const kotRef=r=>['records/kotogara',r.point,r.source,r.quote].join('/');
const pointsIn=sheets=>{const refs=new Set(sheets.flatMap(sh=>sh.kotogara.map(x=>x.ref)));return new Set(R.kotogara.filter(r=>refs.has(kotRef(r))).map(r=>r.point))};
const VIEW_POINTS=pointsIn([SHEET]);
const OTHER_POINTS=pointsIn(D.sheets.filter(sh=>sh.view_kind!=='テーマ'));
const THEME_POINTS=new Set(R.kotogara.map(r=>r.point).filter(p=>!OTHER_POINTS.has(p)&&!VIEW_POINTS.has(p)));
const inScope=r=>VIEW_POINTS.has(r.point)||THEME_POINTS.has(r.point);
const kot={}; R.kotogara.filter(inScope).forEach(r=>(kot[r.point]=kot[r.point]||[]).push(r));
Object.values(kot).forEach(a=>a.sort((x,y)=>(x.source_date+x.source).localeCompare(y.source_date+y.source)));
/* 主な事項の並び（LINK_SCHEMA §16.2）：その見方の事柄、テーマ全体の事柄の順。それぞれ町の資料の最新の記載の日付が新しい順、同じなら行の数が多い順、それも同じならテーマの定義の順。町の資料の記載が無い事柄は最後 */
const docDate=p=>(kot[p]||[]).filter(r=>!r.source.startsWith('sp:')).map(r=>r.source_date).sort().pop()||'';
const cmpPoint=(a,b)=>{const da=docDate(a),db=docDate(b);if(!da!==!db)return da?-1:1;if(da!==db)return da<db?1:-1;if(kot[a].length!==kot[b].length)return kot[b].length-kot[a].length;return a<b?-1:a>b?1:0};
const pointsOf=f=>[...new Set(R.kotogara.filter(f).map(r=>r.point))].sort(cmpPoint);
const ORDER=pointsOf(r=>VIEW_POINTS.has(r.point)).concat(pointsOf(r=>THEME_POINTS.has(r.point)));
/* カードの値：町の資料の最新の記載の value（無ければ target）。町の資料の記載が無ければ null */
/* 町の資料の最新の日付の行：value か target のある行を全部（変更でない行を先に、同じなら行の順）。無ければ最後の行だけ（§16.2） */
function latestAll(p){const base=(kot[p]||[]).filter(r=>!r.source.startsWith('sp:'));if(!base.length)return [];const d=base[base.length-1].source_date;const last=base.filter(r=>r.source_date===d);const v=last.filter(r=>r.value||r.target);if(!v.length)return [last[last.length-1]];return v.filter(r=>r.kind!=='変更').concat(v.filter(r=>r.kind==='変更'))}
function latest(p){const a=latestAll(p);return a.length?a[0]:null}
const NONE='町の資料に記載なし';
const cv=c=>c?(c.value||c.target||''):'';
/* 会議ごとの一般質問：件数と、質問ごとの会議録へのリンク（議員名は出さない） */
const bqTitles=x=>{const t=x.titles||[];return t.map(y=>`問${y.n}「${y.title}」`).join('、')+(!x.titles_chosen&&t.length>1?'（どの問いに当たるかは確かめていない）':'')};
const exByMeeting=()=>{const g={};D.exchanges.forEach(x=>{(g[x.meeting_id]=g[x.meeting_id]||{d:x.date,m:x.meeting,urls:[]}).urls.push((x.turns[0]||{}).url||'')});return Object.values(g)};
const exLinks=g=>`関連する質問 ${g.urls.length}件：会議録 ${g.urls.map((u,i)=>A(u,String(i+1))).join('・')}`;
const qa={}; ['yaritori','shitsugi'].forEach(n=>R[n].forEach(q=>q.rows.forEach(r=>{if(r.point)(qa[r.point]=qa[r.point]||[]).push({q,r,n})})));
/* 記載の行と項目（LINK_SCHEMA §16.1・§16.2。DESIGN.md ADR-37）：事項の欄に、about がその事項の記載の行を事柄の行と一緒に資料の日付の順に出す。
   項目（suji）のある行には記載の種類と「同じ項目の記載（N件）」を付ける */
const SUJI=new Map((D.suji||[]).map(x=>[x.key,x]));
const kis={}; (R.kisai||[]).forEach(r=>{if(r.about)(kis[r.about]=kis[r.about]||[]).push(r)});
const refOf=(led,r)=>led==='kisai'?['records/kisai',r.title,r.source].join('/'):kotRef(r);
const shuruiOf=r=>r.shurui||(r.source.startsWith('sp:')?'会議録':'町の資料');
const kindOf=(led,r)=>led==='kisai'?(r.kind||''):(r.suji_key?'事実':'');
const KD=k=>k?`<span class="kd">${esc(k)}</span>`:'';
const UM=layer=>layer&&layer!=='確定'?'<span class="um">未確認</span>':'';
function sujiBlock(led,r){const x=r.suji_key&&SUJI.get(r.suji_key);if(!x)return '';const me=refOf(led,r);
  return `<details class="suji"><summary>同じ項目の記載（${x.rows.length}件）</summary><ol>${x.rows.map(y=>`<li class="${y.ref===me?'self':''}">${KD(y.kind)}<span class="pt">${esc(y.point||'事項の指定なし')}${y.target?'　対象の時期：'+esc(y.target):''}${y.ref===me?'　表示中の記載':''}</span>${UM(y.layer)}<div>${esc(y.quote)}</div></li>`).join('')}</ol></details>`}
/* 事項の欄の1行：事柄の記録か記載の行。記載の種類・対象の時期・未確認・資料の種類・同じ項目の記載 */
const pointRow=(led,r)=>`<div class="row"><span class="d">${esc(jd(r.source_date))}</span><span><span class="tag ${r.source.startsWith('sp:')?'t-a':'t-doc'}">${esc(shuruiOf(r))}</span></span><span>${KD(kindOf(led,r))}${led==='kisai'&&r.target?`<span class="um">対象の時期：${esc(r.target)}</span> `:''}${esc(r.quote)}${UM(r.layer)}<div class="src">${A(r.url,lab(r.source))}${led==='kotogara'&&r.kind==='変更'?'　変更前：'+esc(r.prev):''}</div>${sujiBlock(led,r)}</span></div>`;
const pointRows=p=>(kot[p]||[]).map(r=>({led:'kotogara',r})).concat((kis[p]||[]).map(r=>({led:'kisai',r}))).sort((a,b)=>(a.r.source_date+a.r.source).localeCompare(b.r.source_date+b.r.source));
const KIND_NOTE=(R.kisai||[]).some(r=>r.kind)||(D.suji||[]).length?`<div class="note">記載の種類：${['事実','見通し','評価','要望'].map(KD).join('')}　評価・要望・見通しの区分は、資料の作成者（監査委員など）が記した内容の種類です。論点ノートによる評価ではありません。</div>`:'';

/* ===== 概要 ===== */
function gaiyo(){
  const o=[`<p class="intro">公開資料（計画・予算・会議録・議会だより・広報ひの等）から${SELF}に関する記載を抜き出し、出典付きで整理したものです。評価や判断は加えていません。</p>`];
  const items=ORDER.filter(p=>kot[p]).map(p=>{const all=latestAll(p);const c=all[0]||null;const chg=kot[p].filter(r=>r.kind==='変更').pop();
    const v=all.map(cv).filter(Boolean).join('／');
    return {title:p,value:c?(v||`最新の記載：${jd(c.source_date)}`):NONE,none:!c,render:()=>{
      const rows=kot[p];
      if(!c)return `<h3>${esc(p)}</h3><div class="now"><span class="v">${NONE}</span></div><div class="note">会議録の発言を日付順に示します。</div>`+
        `<div class="rows">${pointRows(p).map(x=>pointRow(x.led,x.r)).join('')}</div>`;
      return `<h3>${esc(p)}</h3><div class="now"><span class="v">${esc(v)}${v&&c.kind==='予定'?'（予定）':''}</span>${chg?`<span class="was">当初：${esc(chg.prev)}　→　${esc(jd(chg.source_date))}に変更</span>`:''}</div>`+
      (all.length>1?all.map(r=>`<div class="q">${cv(r)?`<b>${esc(cv(r))}</b>　`:''}${esc(r.quote)}</div>`).join(''):`<div class="q">${esc(c.quote)}</div>`)+
      `<div class="src">最新の記載（町の資料）：${esc(jd(c.source_date))}　${A(c.url,lab(c.source))}</div>`+
      (chg&&chg.reason?`<div class="note">変更理由：${esc(chg.reason)}</div>`:'')+
      `<div class="rows">${pointRows(p).map(x=>pointRow(x.led,x.r)).join('')}</div>`}}});
  o.push(sec('主な事項','項目を選ぶと、最新の記載と記載の推移を表示します',KIND_NOTE+picker('pk-jiko',items)));
  /* 枠組みの表（LINK_SCHEMA §16.1。ADR-37）：要素・該当する事項・資料別の記載年・議会での質問・答弁の記録数。関係は出典の図で見る。要素の note は出さない */
  (D.waku||[]).forEach(W=>o.push(sec(`${W.name}と、資料の記載状況`,'',`<p class="note">出典：${A(W.url,lab(W.source))}（${esc(W.source)}）</p>`+
    tbl(['番号','要素','該当する事項','資料別の記載年','議会での質問・答弁の記録数'],W.elements.map(e=>`<tr><td class="num">${esc(e.n)}</td><td>${esc(e.name)}</td><td>${e.points.length?e.points.map(esc).join('<br>'):'<span class="note">該当する事項なし</span>'}</td><td>${Object.keys(e.rec).length?Object.entries(e.rec).map(([k,v])=>`${esc(k)}：${v.map(esc).join('・')}`).join('<br>'):'<span class="note">未記録</span>'}</td><td class="num">${e.points.length?esc(e.gikai):'—'}</td></tr>`))+
    `<p class="note">要素の名前は出典の語のままです。要素間の関係は、出典の図をご覧ください。「資料別の記載年」は資料の日付の年で、未確認の記録を含みます。「議会での質問・答弁の記録数」は、その事項について記録した一般質問・議案質疑の、確定した行の数です。</p>`)));
  // 経過
  const ev=[];
  /* 過程の段階は step の順。from の無い段階は1つ前の段階の直後（最初なら先頭）に置き「日付なし」と示す（§16.2） */
  let prevKey='';
  R.katei.slice().sort((a,b)=>(+a.step)-(+b.step)).forEach((k,i)=>{const key=k.from||prevKey;prevKey=key;ev.push({d:k.from||'',k:key,o:i+1,nd:!k.from,c:'',h:`${k.cycle?esc('期：'+k.cycle+'。'):''}<b>${esc(k.name)}</b>${k.to&&k.to!==k.from?`<span class="note">（〜${esc(jd(k.to))}）</span>`:''}${!k.to&&k.from?'<span class="note">（継続中）</span>':''}　${A(k.url,'資料')}`,cur:!k.to&&k.from})});
  D.bills.forEach(b=>ev.push({d:b.date,c:'k-gikai',h:`<span class="tag">議決</span> ${A(b.url,b.title)}　${esc(b.result)}`}));
  exByMeeting().forEach(g=>ev.push({d:g.d,c:'k-gikai',h:`<span class="tag">一般質問</span> ${esc(g.m)}　${exLinks(g)}`}));
  R.kotogara.filter(r=>r.kind==='変更'&&inScope(r)).forEach(r=>ev.push({d:r.source_date,c:'k-change',h:`<span class="tag">予定の変更</span> ${esc(r.point)}：${esc(r.prev)} → ${esc(r.target)}　${A(r.url,'資料')}`}));
  ev.forEach(e=>{if(e.k===undefined){e.k=e.d;e.o=e.d?1e6:1e9}});
  const list=ev.slice().sort((a,b)=>a.k.localeCompare(b.k)||a.o-b.o);
  o.push(sec('経過','検討の段階（太字）と、議決・一般質問・予定の変更を日付順に示します',`<div class="nen">${list.map(e=>`<div class="d">${esc(e.d?jd(e.d):(e.nd?'日付なし':'日付不明'))}</div><div class="${e.c}${e.cur?' cur':''}">${e.h}</div>`).join('')}</div>`));
  // 施設
  const fs={}; R.shisetsu.forEach(r=>(fs[r.facility]=fs[r.facility]||[]).push(r));
  const fitems=Object.keys(fs).sort((a,b)=>fs[b].length-fs[a].length).map(k=>{const f=(D.names.facilities||{})[k]||{};const rows=fs[k].slice().sort((a,b)=>(a.source_date+a.source).localeCompare(b.source_date+b.source));const st=rows.filter(r=>r.aspect==='状態');const last=st[st.length-1];
    return {title:(f.name||k)+(f.district?`（${f.district}）`:''),value:last?short(last.value,14):'—',render:()=>`<h3>${esc(f.name||k)}${f.district?`<span class="note">　${esc(f.district)}地区</span>`:''}</h3><div class="rows">${rows.map(r=>`<div class="row"><span class="d">${esc(jd(r.source_date))}</span><span><span class="tag t-doc">${esc({'種類':'種別','状態':'状況'}[r.aspect]||r.aspect)}</span></span><span><b>${esc(r.value)}</b>${r.target?`（${esc(r.target)}）`:''}${r.kind==='予定'?'<span class="note">　予定</span>':''}<div>${esc(r.quote)}</div><div class="src">${A(r.url,lab(r.source))}</div></span></div>`).join('')}</div>`}});
  o.push(sec('施設の再編','施設を選ぶと、種別・運営・役割・状況の記載を表示します',picker('pk-fac',fitems)));
  const docs=D.docs.slice().sort((a,b)=>(b.date||b.fiscal_year).localeCompare(a.date||a.fiscal_year));
  const CAT={koho:'広報ひの',shingi:'懇話会・審議会',jigyo:'事業資料',yosan:'予算',kessan:'決算',kofukin:'交付金',bosai:'防災'};
  o.push(sec('資料','',`<details><summary>参照資料（${docs.length}件）</summary>${tbl(['日付','種別','資料名'],docs.map(x=>`<tr><td class="date">${esc(x.date?jd(x.date):x.fiscal_year+'年度')}</td><td>${esc(CAT[x.category]||x.category)}</td><td>${A(x.url,x.title)}${x.archived?`<div class="note">町のサイトに載らなくなったため、Webアーカイブの保存版（${esc(jd(x.archived))}保存）を開きます。町の元の url：${esc(x.original_url)}</div>`:''}</td></tr>`))}</details>`+
    `<details><summary>関連計画（${D.plans.length}件）</summary>${tbl(['計画','計画期間','策定・改正'],D.plans.map(p=>`<tr><td>${A(p.url,p.name)}</td><td>${esc(p.start_fy)}〜${esc(p.end_fy)}年度</td><td>${esc(p.posted)}</td></tr>`))}</details>`));
  /* 資料の種類と根拠法令（LINK_SCHEMA §16.1。ADR-37 の5） */
  if((D.shiryo||[]).length)o.push(sec('資料の種類と根拠法令','',tbl(['資料の種類','作成者','根拠法令','提出先・公表','対応状況を確認できる資料'],D.shiryo.map(x=>`<tr><td>${esc(x.shurui)}</td><td>${esc(x.tsukuru)}</td><td>${esc(x.konkyo)}</td><td>${esc(x.atesaki)}</td><td>${esc(x.outou)}</td></tr>`))+
    D.shiryo.map(x=>`<p class="note">${esc(x.shurui)}の出典：${esc(x.source)}</p>`).join('')));
  return o.join('');
}

/* キーワード検索の結果の語：語の一致の回数の多い順に3つ（同じ回数は語の順） */
function topWords(){const c={};D.hits.council.concat(D.hits.docs).forEach(h=>(h.words||[]).forEach(w=>c[w.word]=(c[w.word]||0)+w.count));
  return Object.keys(c).sort((a,b)=>c[b]-c[a]||(a<b?-1:a>b?1:0)).slice(0,3).map(w=>`「${w}」`).join('')}
/* ===== 論点整理 ===== */
function ronten(){
  const o=[`<p class="intro">一般質問や答弁を作成する際の準備に使います。事項ごとに、これまでの質問・答弁と町の資料の記載を日付順に並べ、過去の答弁との整合や、まだ取り上げられていない事項を確認できます。</p>`];
  const pts=Object.keys(qa).sort((a,b)=>qa[b].length-qa[a].length);
  const items=pts.map(p=>({title:p,value:`質問・答弁 ${qa[p].length}件`,meta:true,render:()=>{
    const rows=qa[p].map(x=>({d:x.q.date,k:x.r.side==='問い'?'q':(x.r.kind==='留保'?'hold':'a'),who:x.r.side==='問い'?`${x.q.member.name} 議員`:x.r.speaker,text:x.r.quote,url:x.r.url,src:x.q.meeting+(x.n==='shitsugi'?'（議案質疑）':''),kind:KIND[x.r.kind]||x.r.kind}))
      .concat((kot[p]||[]).filter(r=>!r.source.startsWith('sp:')).map(r=>({d:r.source_date,k:'doc',tag:shuruiOf(r),mk:KD(kindOf('kotogara',r)),um:UM(r.layer),who:'',text:r.quote,url:r.url,src:lab(r.source),kind:'',extra:sujiBlock('kotogara',r)})))
      .concat((kis[p]||[]).map(r=>({d:r.source_date,k:'doc',tag:shuruiOf(r),mk:KD(r.kind)+(r.target?`<span class="um">対象の時期：${esc(r.target)}</span> `:''),um:UM(r.layer),who:'',text:r.quote,url:r.url,src:lab(r.source),kind:'',extra:sujiBlock('kisai',r)})))
      .sort((a,b)=>a.d.localeCompare(b.d));
    const TAG={q:['t-q','質問'],a:['t-a','答弁'],hold:['t-hold','答弁（今後検討）'],doc:['t-doc','町の資料']};
    return `<h3>${esc(p)}</h3><div class="note">質問・答弁と町の資料を日付順に示します。「答弁（今後検討）」は、時期や内容を今後決めるとした答弁です。</div><div class="rows">${rows.map(r=>`<div class="row"><span class="d">${esc(jd(r.d))}</span><span><span class="tag ${TAG[r.k][0]}">${esc(r.tag||TAG[r.k][1])}</span><div class="who">${esc(r.who)}</div></span><span>${r.mk||''}${esc(r.text)}${r.um||''}<div class="src">${A(r.url,r.src)}${r.kind?'　'+esc(r.kind):''}</div>${r.extra||''}</span></div>`).join('')}</div>`}}));
  o.push(sec('事項ごとの質問・答弁','事項を選ぶと、質問・答弁と町の資料の記載を日付順に表示します',KIND_NOTE+picker('pk-qa',items)+`<div class="note">質問・答弁を項目ごとに記録したのは、関連する一般質問${D.theme_questions}問のうち${R.yaritori.length}問と、議案質疑${R.shitsugi.length}件です。</div>`));
  const iss=t=>D.issues.filter(x=>x.type===t);
  /* 照合結果の文と、比べた記載（出典つき。閉じた欄） */
  /* 構造にしていない記載の行は、種類（kind）を印で、対象の時期（target）を「対象の時期：」で添える（LINK_SCHEMA §16.1。ADR-36・ADR-37） */
  const KIS=new Map((R.kisai||[]).map(k=>[`records/kisai/${k.title}/${k.source}`,k]));
  const kisTag=r=>{const k=KIS.get(r.ref);return k&&k.kind?`<span class="tag">${esc(k.kind)}</span> `:''};
  const kisTarget=r=>{const k=KIS.get(r.ref);return k&&k.target?`　対象の時期：${esc(k.target)}`:''};
  const refsOf=x=>x.refs&&x.refs.length?`<details><summary>比べた記載（${x.refs.length}件）</summary><ul class="plain">${x.refs.map(r=>`<li>${kisTag(r)}${A(r.url,short(r.text||r.ref,70))}${kisTarget(r)}${r.layer!=='確定'?' <span class="mk">未確認</span>':''}</li>`).join('')}</ul></details>`:'';
  const li=(xs,cut)=>`<ul class="plain">${xs.map(x=>`<li>${esc(cut?x.statement.split('。')[0]:x.statement)}${refsOf(x)}</li>`).join('')}</ul>`;
  const rep=iss('繰り返し問われている点'), hold=iss('留保のその後'), chg=iss('予定の変更'), not=iss('問われていない点'), kb=iss('問われていない区分')[0];
  o.push(sec('照合結果（未確認）','資料を機械的に照合した結果で、人による確認は済んでいません',
    `<div class="two"><div class="box"><h3>複数の定例会議で質問された事項 <span class="mk">未確認</span></h3>${li(rep)}</div><div class="box"><h3>「今後検討」等と答弁された事項 <span class="mk">未確認</span></h3>${li(hold)}</div></div>`+
    `<details><summary>予定時期が変わった事項（${chg.length}件）</summary>${li(chg)}</details>`+
    `<details><summary>計画等に記載があり、記録した質問では取り上げられていない事項（${not.length}件）</summary>${li(not,true)}</details>`+
    (kb?`<details><summary>質問内容の内訳</summary><p class="q">${esc(kb.statement)}</p>${refsOf(kb)}</details>`:'')));
  const ex=D.exchanges.slice().reverse().map(x=>`<tr><td class="date">${esc(jd(x.date))}</td><td>${esc(x.meeting)}</td><td>${esc(x.member.name)} 議員</td><td>${esc(bqTitles(x))}</td><td>${A(x.turns[0]&&x.turns[0].url,'会議録')}</td></tr>`);
  o.push(sec('一般質問と議案','',`<details><summary>関連する一般質問（${D.exchanges.length}件・新しい順）</summary>${tbl(['日付','定例会議','質問者','議会だよりの見出し','会議録'],ex)}</details>`+
    `<details><summary>関係議案と議決結果（${D.bills.length}件）</summary>${tbl(['議決日','議案','議決結果','採決方法','討論'],D.bills.map(b=>`<tr><td class="date">${esc(jd(b.date))}</td><td>${A(b.url,b.no+' '+b.title)}</td><td>${esc(b.result)}</td><td>${esc(b.method)}</td><td>${b.debates.map(x=>esc(x.stance+'（'+x.member.name+' 議員）')).join('<br>')||'なし'}</td></tr>`))}</details>`+
    `<details><summary>キーワード検索の結果（参考・${D.hits.council.length+D.hits.docs.length}件）</summary><p class="note">${esc(topWords())}等のキーワードが一致した会議録・議会だより・町の資料です。${SELF}に関するものとは限りません。</p>${tbl(['日付','種別','該当箇所','開く'],D.hits.council.slice().reverse().map(x=>`<tr><td class="date">${esc(jd(x.date))}</td><td>${esc(x.kind==='問い'?'一般質問':x.kind)}</td><td class="q">${esc(short(x.excerpt,90))}</td><td>${A(x.url,'開く')}</td></tr>`))}</details>`));
  return o.join('');
}

/* ===== 事業の運営 ===== */
function unei(){
  const o=[`<p class="intro">事業担当課が、事業の目的と手段を整理し、予算要求や議会での説明に備えるために使います。</p>`];
  // 目的と手段
  const mt=R.tsunagari.filter(r=>r.link==='目的と手段');
  const edges={}; mt.forEach(r=>{const k=r.upper+'\u0000'+r.lower;(edges[k]=edges[k]||{u:r.upper,l:r.lower,rows:[]}).rows.push(r)});
  const E=Object.values(edges); const lowers=new Set(E.map(e=>e.l));
  let mine=null; SHEET.tsunagari.forEach(x=>{const r=R.tsunagari.find(t=>['records/tsunagari',t.link,t.upper,t.lower,t.source].join('/')===x.ref);if(r){const s=new Set([r.upper,r.lower]);mine=mine?new Set([...mine].filter(v=>s.has(v))):s}}); mine=mine||new Set();
  let chain='';const seen=new Set();
  function walk(n,lv,via){chain+=(via?`<div class="arrow lv${lv}">↓ 手段（記載：${A(via.rows[0].url,lab(via.rows[0].source))}${via.rows.length>1?` ほか${via.rows.length-1}件`:''}）</div>`:'')+`<div class="node lv${lv}${mine.has(n)?' mine':''}">${esc(n)}${mine.has(n)&&P.view_kind!=='テーマ'?`<small>${SELF}</small>`:''}</div>`;if(seen.has(n))return;seen.add(n);E.filter(e=>e.u===n).forEach(e=>walk(e.l,Math.min(lv+1,4),e))}
  [...new Set(E.map(e=>e.u))].filter(u=>!lowers.has(u)).sort().forEach(u=>{chain+='<div style="height:4px"></div>';walk(u,1,null)});
  /* 計画に掲げる課題：計画ごとに分け、計画の名前と出典のページを付ける（§16.1） */
  const kgroups=[]; SHEET.kadai.forEach(x=>{const kplan=D.plans.find(p=>(x.ref||'').startsWith(p.key+'/'));const name=kplan?kplan.name:'計画';let g=kgroups.find(g=>g.name===name);if(!g){const kpg=((x.source||'').match(/p\.(\d+)(?:-(\d+))?/)||[]);g={name,url:x.url,src:name+(kpg[1]?` ${kpg[1]}${kpg[2]?'〜'+kpg[2]:''}ページ`:''),items:[]};kgroups.push(g)}g.items.push(x)});
  const kadaiPlan=kgroups.length===1?kgroups[0].name:'計画';
  const vision=SHEET.vision.map(v=>`<p class="q" style="margin:0">${esc(v.text.replace(/^めざす姿:/,''))}</p><div class="note">${A(v.source,'総合計画')}</div>`).join('');
  const kadai=kgroups.length?kgroups.map(g=>`${kgroups.length>1?`<div class="note"><b>${esc(g.name)}</b></div>`:''}<ul class="plain">${g.items.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul><div class="note">${A(g.url,g.src)}</div>`).join(''):`<p class="note">${NOREC}</p>`;
  const up=D.issues.filter(x=>x.type==='つながりの記録に無い目的');
  o.push(sec('目的と手段','資料に記載された関係のみを示し、記載のない関係は加えていません',
    `<div class="two"><div class="box"><h3>総合計画のめざす姿</h3>${vision}</div><div class="box"><h3>${esc(kadaiPlan)}に掲げる課題</h3>${kadai}</div></div>`+
    `<div class="box"><h3>目的と手段の関係</h3><div class="chain">${chain}</div>${up.length?`<div class="note">上位の目的との関係が未記録の事項：${up.map(x=>esc((x.statement.match(/「(.+?)」/)||[])[1]||'')).join('、')}</div>`:''}</div>`+
    `<p class="note">ロジックモデル（課題・投入・活動・結果・成果）への位置付けは、担当課が判断します。</p>`));
  // 年度ごとの節目
  const fy=s=>{const [y,m]=s.split('-').map(Number);return m>=4?y:y-1};
  const years={}; const add=(d,col,h)=>{if(!d)return;const y=fy(d);(years[y]=years[y]||{step:[],gikai:[],plan:[]})[col].push(h)};
  R.katei.slice().sort((a,b)=>(+a.step)-(+b.step)).forEach(k=>{const h=`${k.cycle?esc('期：'+k.cycle+'。'):''}${esc(k.name)}　${A(k.url,'資料')}`;if(k.from)add(k.from,'step',h);else (years.nodate=years.nodate||{step:[],gikai:[],plan:[]}).step.push(h)});
  D.bills.forEach(b=>add(b.date,'gikai',`${esc(jd(b.date))} 議決：${A(b.url,b.title)}`));
  exByMeeting().forEach(g=>add(g.d,'gikai',`${esc(g.m)} 一般質問　${exLinks(g)}`));
  R.shitsugi.forEach(q=>add(q.date,'gikai',`${esc(jd(q.date))} 議案質疑（${esc(q.member.name)} 議員）　${A((q.rows[0]||{}).url,'会議録')}`));
  R.kotogara.filter(r=>(r.kind==='予定'||r.kind==='変更')&&inScope(r)).forEach(r=>add(r.source_date,'plan',`${esc(r.point)}：${esc(r.target)}${r.kind==='変更'?'（変更）':''}　${A(r.url,'資料')}`));
  const wa=y=>y>=2019?`令和${y===2019?'元':y-2018}年度`:`${y}年度`;
  o.push(sec('年度ごとの節目','検討の段階・議会・予定の記載を年度ごとにまとめます',tbl(['年度','検討の段階','議会','予定の記載'],Object.keys(years).sort((a,b)=>a==='nodate'?1:b==='nodate'?-1:a.localeCompare(b)).map(y=>`<tr><td class="date">${y==='nodate'?'年度不明':wa(+y)}</td><td>${years[y].step.join('<br>')}</td><td>${years[y].gikai.join('<br>')}</td><td>${[...new Set(years[y].plan)].join('<br>')}</td></tr>`))+
    `${bud?`<p class="note">令和${esc(budFy)}年度の当初予算額は${num(bud.amount)}${esc(bud.unit)}（${A(bud.url,'予算の附表')}）。それより前の年度の予算額は、まだ取り込んでいません。</p>`:''}`));
  return o.join('');
}

document.getElementById('p-gaiyo').innerHTML=gaiyo();

document.getElementById('p-unei').innerHTML=unei();

const views=['gaiyo','ronten','unei'];
function show(){const v=views.includes(location.hash.slice(1))?location.hash.slice(1):'gaiyo';views.forEach(n=>document.getElementById('p-'+n).hidden=(n!==v));document.querySelectorAll('nav.menu a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
window.addEventListener('hashchange',show);show();
})();
